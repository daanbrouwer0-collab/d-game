<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>D-Game</title>
    <meta
      name="description"
      content="D-Game multiplayer sandbox — P2P games via deellink of QR."
    />
    <!--
      Netlify hash-shell (upload once).
      Games/pages load from GitHub via jsDelivr — push to main updates the site
      without re-uploading this file. Keep this shell thin: routing + iframe only.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background: #1a1f2e;
      }
      #site-frame {
        display: block;
        width: 100%;
        height: 100%;
        height: 100dvh;
        border: 0;
        background: #1a1f2e;
      }
      #site-boot,
      #site-error {
        font-family: system-ui, sans-serif;
        padding: 2rem;
        color: #e8ecf4;
        max-width: 28rem;
      }
      #site-error button {
        margin-top: 1rem;
        font: inherit;
        padding: 0.55rem 0.9rem;
        border-radius: 8px;
        border: 0;
        background: #5b8cff;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p id="site-boot">D-Game laden…</p>
    <iframe id="site-frame" title="D-Game" hidden></iframe>
    <script>
      (function () {
        /**
         * Stable shell config — change only if the GitHub repo moves.
         * Game content always comes from GitHub; this file stays on Netlify.
         */
        const CONFIG = {
          repo: "daanbrouwer0-collab/d-game",
          branch: "main",
          subpath: "multi-game",
          /** Re-check latest commit at most this often (ms) while the tab stays open */
          shaRefreshMs: 60_000,
        };

        const bootEl = document.getElementById("site-boot");
        const frame = document.getElementById("site-frame");
        let showGen = 0;
        let currentShown = "";
        let cdnBase = "";
        let resolvedSha = "";
        let shaFetchedAt = 0;

        function showBoot(msg) {
          if (!bootEl) return;
          bootEl.hidden = false;
          bootEl.textContent = msg;
          frame.hidden = true;
        }

        function showFrame() {
          if (bootEl) bootEl.hidden = true;
          frame.hidden = false;
        }

        function showFatal(message) {
          document.body.innerHTML =
            '<div id="site-error"><p>' +
            message +
            '</p><button type="button" id="site-retry">Opnieuw proberen</button></div>';
          document.getElementById("site-retry")?.addEventListener("click", () => {
            location.reload();
          });
        }

        function normalizePath(path) {
          let p = String(path || "index.html").replace(/^\/+/, "");
          const qi = p.indexOf("?");
          if (qi >= 0) p = p.slice(0, qi);
          if (!p || p.endsWith("/")) p += "index.html";
          return p;
        }

        function parseHash(hash) {
          const raw = (hash || "#index.html").replace(/^#/, "");
          const qi = raw.indexOf("?");
          const pathPart = qi >= 0 ? raw.slice(0, qi) : raw;
          const search = qi >= 0 ? raw.slice(qi) : "";
          return { path: normalizePath(pathPart), search };
        }

        function overrideVersionFromUrl() {
          try {
            const v = new URLSearchParams(location.search).get("v");
            if (v && /^[a-zA-Z0-9._\-]+$/.test(v)) return v;
          } catch (_) {
            /* ignore */
          }
          try {
            const v = localStorage.getItem("dgame.shellVersion");
            if (v && /^[a-zA-Z0-9._\-]+$/.test(v)) return v;
          } catch (_) {
            /* ignore */
          }
          return null;
        }

        async function resolveCdnBase(force) {
          const now = Date.now();
          if (
            !force &&
            cdnBase &&
            now - shaFetchedAt < CONFIG.shaRefreshMs
          ) {
            return cdnBase;
          }

          const pinned = overrideVersionFromUrl();
          let version = pinned || CONFIG.branch;

          if (!pinned) {
            try {
              const res = await fetch(
                `https://api.github.com/repos/${CONFIG.repo}/commits/${CONFIG.branch}?per_page=1`,
                { cache: "no-store" },
              );
              if (res.ok) {
                const data = await res.json();
                if (data.sha) version = data.sha;
              }
            } catch (_) {
              /* keep branch tip / previous sha */
              if (resolvedSha) version = resolvedSha;
            }
          }

          resolvedSha = version;
          shaFetchedAt = now;
          cdnBase = `https://cdn.jsdelivr.net/gh/${CONFIG.repo}@${version}/${CONFIG.subpath}`;
          return cdnBase;
        }

        function rewriteAssetUrls(html, pagePath, base) {
          const pageDir = pagePath.includes("/")
            ? pagePath.slice(0, pagePath.lastIndexOf("/") + 1)
            : "";
          const pageBase = `${base}/${pageDir}`;
          if (!/<base\s/i.test(html)) {
            html = html.replace(
              /<head([^>]*)>/i,
              `<head$1><base href="${pageBase}">`,
            );
          }
          return html;
        }

        function pathFromHref(href, currentPath) {
          if (!href || /^(mailto:|tel:|javascript:)/i.test(href)) return null;
          if (href.startsWith("#")) return parseHash(href);
          try {
            if (/^(https?:)?\/\//i.test(href)) {
              const url = new URL(href);
              const marker = `/${CONFIG.subpath}/`;
              const idx = url.pathname.indexOf(marker);
              if (idx < 0) return null;
              const rest = url.pathname.slice(idx + marker.length);
              return {
                path: normalizePath(rest),
                search: url.search || "",
              };
            }
            const currentDir = currentPath.includes("/")
              ? currentPath.slice(0, currentPath.lastIndexOf("/") + 1)
              : "";
            const resolved = new URL(
              href,
              `https://local.invalid/${currentDir}`,
            );
            return {
              path: normalizePath(resolved.pathname.replace(/^\//, "")),
              search: resolved.search || "",
            };
          } catch {
            return null;
          }
        }

        function wireNavigation(doc) {
          doc.addEventListener(
            "click",
            (event) => {
              const anchor = event.target.closest("a");
              if (!anchor || anchor.target === "_blank") return;
              const href = anchor.getAttribute("href");
              const next = pathFromHref(href, parseHash(location.hash).path);
              if (!next) return;
              event.preventDefault();
              event.stopPropagation();
              const nextHash = `#${next.path}${next.search}`;
              history.pushState(
                { path: next.path, search: next.search },
                "",
                nextHash,
              );
              navigate(next.path, { force: true });
            },
            true,
          );
        }

        async function show(path) {
          const gen = ++showGen;
          const pagePath = normalizePath(path);
          const base = await resolveCdnBase(false);
          if (gen !== showGen) return;

          const res = await fetch(`${base}/${pagePath}`, { cache: "no-cache" });
          if (gen !== showGen) return;
          if (!res.ok) {
            throw new Error(`Pagina niet gevonden: ${pagePath}`);
          }

          const html =
            rewriteAssetUrls(await res.text(), pagePath, base) +
            `<!-- shell r${gen} ${resolvedSha.slice(0, 7)} -->`;

          await new Promise((resolve) => {
            const done = () => {
              frame.removeEventListener("load", done);
              resolve();
            };
            frame.addEventListener("load", done);
            frame.removeAttribute("srcdoc");
            frame.src = "about:blank";
          });
          if (gen !== showGen) return;

          await new Promise((resolve) => {
            frame.onload = () => {
              try {
                const doc = frame.contentDocument;
                if (doc) {
                  wireNavigation(doc);
                  const title = doc.querySelector("title");
                  if (title && title.textContent) {
                    document.title = title.textContent;
                  }
                }
              } catch (_) {
                /* ignore */
              }
              resolve();
            };
            frame.srcdoc = html;
          });

          currentShown = pagePath;
          showFrame();
        }

        /**
         * Public API for game iframes (site-url.js navigateInShell).
         * Stable contract — keep this name when editing the shell.
         */
        function navigate(path, opts) {
          const pagePath = normalizePath(path);
          if (!opts?.force && pagePath === currentShown) return;
          show(pagePath).catch((err) => {
            showFatal(
              (err && err.message) ||
                "Kon de D-Game-site niet laden vanaf GitHub.",
            );
          });
        }

        window.__dgameNavigate = navigate;
        window.__dgameShell = {
          version: 2,
          navigate,
          getCdnBase: () => cdnBase,
          getSha: () => resolvedSha,
          refresh: () => resolveCdnBase(true),
        };

        // Backup if a game cannot call parent.__dgameNavigate directly.
        window.addEventListener("message", (event) => {
          const data = event.data;
          if (!data || typeof data !== "object") return;
          if (data.type === "dgame:navigate" && data.path) {
            const pagePath = normalizePath(data.path);
            const search =
              data.search && String(data.search).startsWith("?")
                ? String(data.search)
                : data.params
                  ? `?${new URLSearchParams(data.params)}`
                  : "";
            const nextHash = `#${pagePath}${search}`;
            if ((location.hash || "") !== nextHash) {
              history.pushState({ path: pagePath, search }, "", nextHash);
            }
            navigate(pagePath, { force: true });
          }
        });

        window.addEventListener("popstate", (event) => {
          const parsed = parseHash(location.hash || "#index.html");
          const path = (event.state && event.state.path) || parsed.path;
          navigate(path, { force: true });
        });

        window.addEventListener("hashchange", () => {
          const parsed = parseHash(location.hash || "#index.html");
          navigate(parsed.path, { force: true });
        });

        (async function boot() {
          showBoot("D-Game laden…");
          await resolveCdnBase(true);
          const initial = parseHash(location.hash || "#index.html");
          history.replaceState(
            { path: initial.path, search: initial.search },
            "",
            `#${initial.path}${initial.search}`,
          );
          await show(initial.path);
        })().catch((err) => {
          showFatal(
            (err && err.message) ||
              "Kon de D-Game-site niet laden vanaf GitHub.",
          );
        });
      })();
    </script>
  </body>
</html>
