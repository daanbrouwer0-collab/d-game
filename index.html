<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D-Game</title>
    <meta
      name="description"
      content="D-Game multiplayer sandbox — P2P games via deellink of QR."
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
      }
      #site-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #site-error {
        font-family: system-ui, sans-serif;
        padding: 2rem;
        color: #333;
      }
    </style>
  </head>
  <body>
    <iframe id="site-frame" title="D-Game"></iframe>
    <script>
      (async function loadMultiGame() {
        const repo = "daanbrouwer0-collab/d-game";
        const subpath = "multi-game";
        let version = "main";

        try {
          const res = await fetch(
            `https://api.github.com/repos/${repo}/commits/main?per_page=1`,
          );
          if (res.ok) {
            const data = await res.json();
            if (data.sha) version = data.sha;
          }
        } catch (_) {
          // blijf op main als de API niet bereikbaar is
        }

        const base = `https://cdn.jsdelivr.net/gh/${repo}@${version}/${subpath}`;
        const frame = document.getElementById("site-frame");

        function normalizePath(path) {
          let p = (path || "index.html").replace(/^\/+/, "");
          if (!p || p.endsWith("/")) p += "index.html";
          return p;
        }

        /** @param {string} hash */
        function parseHash(hash) {
          const raw = (hash || "#index.html").replace(/^#/, "");
          const qi = raw.indexOf("?");
          const pathPart = qi >= 0 ? raw.slice(0, qi) : raw;
          const search = qi >= 0 ? raw.slice(qi) : "";
          return { path: normalizePath(pathPart), search };
        }

        function rewriteAssetUrls(html, pagePath) {
          const pageDir = pagePath.includes("/")
            ? pagePath.slice(0, pagePath.lastIndexOf("/") + 1)
            : "";
          const pageBase = `${base}/${pageDir}`;

          if (!/<base\s/i.test(html)) {
            html = html.replace(
              /<head([^>]*)>/i,
              `<head$1><base href="${pageBase}">`,
            );
          }
          return html;
        }

        function wireNavigation(doc) {
          doc.addEventListener("click", (event) => {
            const anchor = event.target.closest("a");
            if (!anchor) return;

            const href = anchor.getAttribute("href");
            if (!href || href.startsWith("#")) return;
            if (/^(mailto:|tel:|javascript:)/i.test(href)) return;

            const absolute = /^(https?:)?\/\//i.test(href);
            if (absolute) return;

            event.preventDefault();
            const current = parseHash(location.hash).path;
            const currentDir = current.includes("/")
              ? current.slice(0, current.lastIndexOf("/") + 1)
              : "";
            const resolved = new URL(
              href,
              `https://local.invalid/${currentDir}`,
            );
            const nextPath = normalizePath(
              resolved.pathname.replace(/^\//, ""),
            );
            const nextHash = `#${nextPath}${resolved.search || ""}`;
            history.pushState(
              { path: nextPath, search: resolved.search || "" },
              "",
              nextHash,
            );
            show(nextPath);
          });
        }

        async function show(path) {
          const pagePath = normalizePath(path);
          const res = await fetch(`${base}/${pagePath}`);
          if (!res.ok) {
            throw new Error(`Pagina niet gevonden: ${pagePath}`);
          }

          const html = rewriteAssetUrls(await res.text(), pagePath);
          frame.onload = () => {
            try {
              const doc = frame.contentDocument;
              if (!doc) return;
              wireNavigation(doc);
              const title = doc.querySelector("title");
              if (title && title.textContent) {
                document.title = title.textContent;
              }
            } catch (_) {
              // negeer als iframe niet bereikbaar is
            }
          };
          frame.srcdoc = html;
        }

        const initial = parseHash(location.hash || "#index.html");
        history.replaceState(
          { path: initial.path, search: initial.search },
          "",
          `#${initial.path}${initial.search}`,
        );
        await show(initial.path);

        window.addEventListener("popstate", (event) => {
          const parsed = parseHash(location.hash || "#index.html");
          const path =
            (event.state && event.state.path) || parsed.path;
          show(path).catch(() => {
            document.body.innerHTML =
              '<p id="site-error">Kon de D-Game-site niet laden vanaf GitHub.</p>';
          });
        });
      })().catch(() => {
        document.body.innerHTML =
          '<p id="site-error">Kon de D-Game-site niet laden vanaf GitHub.</p>';
      });
    </script>
  </body>
</html>
