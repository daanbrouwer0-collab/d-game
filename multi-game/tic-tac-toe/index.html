<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe — D-Game</title>
    <meta
      name="description"
      content="Speel tic-tac-toe hotseat op dit apparaat, of multiplayer via een D-Game room."
    />
    <link rel="stylesheet" href="../css/site.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <p class="nav"><a href="../">← Games</a></p>
        <h1 class="brand">Tic Tac Toe</h1>
        <p id="connection-status" class="status" data-state="idle">Niet verbonden</p>
      </header>

      <main>
        <section id="lobby" class="panel">
          <h2>Op dit apparaat</h2>
          <p class="lede">
            4×4-bord met 3 geblokkeerde vakjes; 3 op een rij of kolom wint (geen diagonaal).
            Hotseat: wissel om de beurt op dit toestel. Multiplayer met vrienden: start een room op
            de home-pagina.
          </p>

          <label class="field-label" for="player-name">Jouw naam</label>
          <input
            id="player-name"
            class="field"
            type="text"
            maxlength="20"
            placeholder="bijv. Sam"
            autocomplete="nickname"
          />

          <div class="actions">
            <button type="button" id="btn-local" class="btn btn-primary">Opnieuw starten</button>
            <a href="../room/" class="btn btn-ghost">Naar room (multiplayer)</a>
          </div>

          <p id="lobby-hint" class="hint"></p>
          <p id="lobby-error" class="error" role="alert"></p>
        </section>

        <section id="game" class="panel hidden">
          <div class="game-meta">
            <p id="role-label" class="meta"></p>
            <p id="turn-label" class="meta turn-banner"></p>
          </div>

          <div id="turn-timer" class="turn-timer hidden" aria-live="polite">
            <div class="turn-timer-track">
              <div id="turn-timer-fill" class="turn-timer-fill"></div>
            </div>
            <span id="turn-timer-label" class="turn-timer-label">20s</span>
          </div>

          <div id="board" class="board board-4" aria-label="Tic tac toe bord"></div>

          <p id="result-label" class="result"></p>

          <div class="actions">
            <button type="button" id="btn-restart" class="btn btn-primary" disabled>
              Opnieuw spelen
            </button>
            <button type="button" id="btn-leave" class="btn btn-ghost">Terug</button>
          </div>
        </section>
      </main>
    </div>

    <script type="module">
      import { getUrlParams } from "../js/shell/site-url.js";
      import { redirectLegacyGameRoomToShell } from "../js/shell/room-only-multiplayer.js";
      if (getUrlParams().get("embedded") === "1") {
        import("./embedded.js");
      } else if (!redirectLegacyGameRoomToShell()) {
        import("./main.js");
      }
    </script>
  </body>
</html>
