<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room — D-Game</title>
    <link rel="stylesheet" href="../css/site.css" />
    <link rel="stylesheet" href="./room.css" />
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  </head>
  <body>
    <div class="app app-room">
      <header class="header">
        <h1 class="brand">Room</h1>
        <p id="room-status" class="tagline">Niet verbonden</p>
      </header>

      <div id="room-chrome" class="room-chrome hidden" aria-label="Spelers in room">
        <div class="room-roster-bar panel">
          <div class="lobby-header">
            <h2 class="room-roster-title">Spelers</h2>
            <p id="roster-count" class="lobby-count">0 / 6 spelers</p>
          </div>
          <ul id="roster-list" class="player-list"></ul>
        </div>
        <div id="room-chat-root" class="room-chat-root"></div>
      </div>

      <main>
        <section id="panel-idle" class="panel hidden">
          <p class="lede">Room starten…</p>
        </section>

        <p id="room-error" class="hint room-error hidden" role="alert"></p>

        <section id="panel-lobby" class="panel hidden">
          <div id="game-session-banner" class="game-session-banner panel hidden" role="status">
            <p><strong id="game-session-title"></strong> is bezig</p>
            <p id="game-session-hint" class="hint"></p>
            <button type="button" id="btn-go-to-game" class="btn btn-primary">
              Ga naar spel
            </button>
          </div>

          <h2>Stem op een spel</h2>
          <p id="picker-hint" class="hint"></p>
          <ul id="game-picker" class="game-picker"></ul>
          <p id="vote-status" class="hint"></p>
          <div class="room-actions">
            <button type="button" id="btn-start-voted" class="btn btn-primary hidden">
              Start winnend spel
            </button>
            <button type="button" id="btn-leave-room" class="btn btn-ghost">
              Room verlaten
            </button>
          </div>

          <div id="invite-card" class="invite-card hidden">
            <h2>Uitnodigen</h2>
            <p class="room-code-line">Code: <strong id="invite-code"></strong></p>
            <div
              id="invite-qr-host"
              class="invite-qr-host invite-qr-wrap"
              role="img"
              aria-label="QR-code"
            ></div>
            <p><a id="invite-url" class="share-url" href="#" target="_blank" rel="noopener"></a></p>
            <div class="actions share-actions">
              <button type="button" id="btn-copy-invite" class="btn btn-ghost">
                Kopieer link
              </button>
              <button type="button" id="btn-share-invite" class="btn btn-primary">
                Deel link
              </button>
            </div>
          </div>
        </section>

        <section id="panel-playing" class="panel panel-playing hidden">
          <div class="playing-bar">
            <div class="playing-bar-actions">
              <button
                type="button"
                id="btn-leave-game"
                class="btn btn-ghost btn-compact"
                title="Terug naar stemmen"
              >
                ← Lobby
              </button>
              <button
                type="button"
                id="btn-end-session"
                class="btn btn-ghost btn-compact hidden"
                title="Spel beëindigen voor iedereen"
              >
                Stop
              </button>
            </div>
          </div>
          <iframe
            id="game-frame"
            title="Spel"
            class="game-frame"
            sandbox="allow-scripts allow-same-origin allow-forms"
          ></iframe>
          <div id="room-chat-play-slot" class="room-chat-play-slot" aria-label="Room chat"></div>
          <div id="game-end-overlay" class="game-end-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="game-end-title">
            <div class="game-end-card">
              <p id="game-end-title" class="game-end-title">Spel afgelopen</p>
              <p id="game-end-summary" class="game-end-summary hint"></p>
              <button type="button" id="btn-dismiss-end" class="btn btn-primary">
                Terug naar stemmen
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
