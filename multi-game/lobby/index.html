<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rooms — D-Game</title>
    <link rel="stylesheet" href="../css/site.css" />
  </head>
  <body>
    <div class="app app-home">
      <header class="header">
        <h1 class="brand">Rooms</h1>
      </header>
      <main>
        <section class="panel">
          <div class="actions home-room-actions">
            <button type="button" id="btn-create-room" class="btn btn-primary">Host Room</button>
            <button type="button" id="btn-toggle-join" class="btn btn-ghost">Join</button>
          </div>
          <div id="join-box" class="room-join hidden">
            <label for="join-code">Roomcode</label>
            <div class="join-row">
              <input
                id="join-code"
                type="text"
                maxlength="12"
                autocomplete="off"
                placeholder="AB7K2M"
              />
              <button type="button" id="btn-join-room" class="btn btn-primary">
                Join
              </button>
              <button type="button" id="btn-scan-qr" class="btn btn-ghost">
                Scan QR
              </button>
            </div>
            <p id="join-error" class="hint hidden" role="alert"></p>
          </div>
        </section>

        <section class="panel">
          <h2>Mijn rooms</h2>
          <ul id="lobby-list" class="lobby-list"></ul>
          <p id="lobby-empty" class="hint hidden">Nog geen rooms — Host Room hierboven.</p>
        </section>
      </main>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
