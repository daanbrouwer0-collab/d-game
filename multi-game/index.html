<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D-Game</title>
    <meta
      name="description"
      content="D-Game — geen account, geen server, wel multiplayer games."
    />
    <link rel="stylesheet" href="css/site.css" />
  </head>
  <body>
    <div class="app app-home">
      <header class="header">
        <h1 class="brand">D-Game</h1>
        <p class="tagline">
          geen acount geen server wel multi player games
        </p>
      </header>

      <main>
        <section class="panel home-multi-card">
          <a href="lobby/" class="btn btn-primary home-multi-btn">Multi Player</a>
        </section>

        <section class="panel">
          <h2>Single device</h2>
          <ul id="game-list" class="game-list game-info-list"></ul>
        </section>
      </main>
    </div>

    <script type="module">
      import { GAMES } from "./js/core/catalog.js";
      import { mountShellNav } from "./js/shell/nav.js";
      import { isRoomPlayable } from "./js/bridge/embedded-contract.js";

      mountShellNav({ active: "games", base: "" });

      const list = document.getElementById("game-list");
      list.innerHTML = GAMES.map((g) => {
        const roomOk = isRoomPlayable(g.embedded);
        const roomLine = roomOk
          ? "Speelbaar in room"
          : "Room-modus volgt";
        return `
        <li class="game-info-card">
          <div class="game-info-body">
            <strong>${g.title}</strong>
            <span>${g.blurb}</span>
            <span class="game-meta-line">${g.minPlayers}–${g.maxPlayers} spelers · ${roomLine}</span>
          </div>
          <div class="actions">
            <a href="${g.path}" class="btn btn-ghost">Hotseat / solo</a>
          </div>
        </li>`;
      }).join("");
    </script>
  </body>
</html>
