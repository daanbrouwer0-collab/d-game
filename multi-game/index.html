<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D-Game — Games</title>
    <meta
      name="description"
      content="Sandbox voor simpele games met verschillende multiplayer-communicatie."
    />
    <link rel="stylesheet" href="css/site.css" />
  </head>
  <body>
    <div class="app app-home">
      <header class="header">
        <h1 class="brand">D-Game</h1>
        <p class="tagline">
          Multiplayer-sandbox: simpele games, wisselende communicatie.
        </p>
      </header>

      <main>
        <p id="pref-hint" class="pref-hint"></p>
        <section class="panel">
          <h2>Multiplayer</h2>
          <p class="lede">
            Start een room voor je groep — daarna kies je samen een spel.
          </p>
          <div class="actions" style="margin-bottom: 1.5rem">
            <a href="room/" class="btn btn-primary">Start / join room</a>
            <a href="handleiding/" class="btn btn-ghost" style="margin-left: 0.5rem">Hoe werkt multiplayer?</a>
          </div>
        </section>
        <section class="panel">
          <h2>Spellen</h2>
          <p class="lede">
            Solo of hotseat per spel. Multiplayer met vrienden via een room.
          </p>
          <ul id="game-list" class="game-list"></ul>
        </section>
      </main>
    </div>

    <script type="module">
      import { GAMES } from "./js/core/catalog.js";
      import { getPreferredTransport, listTransportMeta } from "./js/core/prefs.js";
      import { loadActiveRoom } from "./js/p2p/room-memory.js";
      import { mountRoomStrip, mountShellNav } from "./js/shell/nav.js";

      mountShellNav({ active: "games", base: "" });
      mountRoomStrip({ base: "" });

      const active = loadActiveRoom();
      if (active?.code && active.isRoomShell) {
        const main = document.querySelector("main");
        const banner = document.createElement("section");
        banner.className = "panel room-continue-banner";
        banner.innerHTML = `
          <p>Je was in room <strong>${active.code}</strong>.</p>
          <a href="room/?room=${encodeURIComponent(active.code)}" class="btn btn-primary">Ga verder in room</a>`;
        main?.prepend(banner);
      }

      const pref = getPreferredTransport();
      const meta = listTransportMeta().find((t) => t.id === pref);
      document.getElementById("pref-hint").innerHTML =
        `Multiplayer via room — transport: <strong>${meta?.label || "P2P"}</strong>.`;

      const list = document.getElementById("game-list");
      list.innerHTML = GAMES.map(
        (g) => `
        <li>
          <a href="${g.path}">
            <strong>${g.title}</strong>
            <span>${g.blurb}</span>
            <span class="game-meta-line">${g.minPlayers}–${g.maxPlayers} spelers · solo/hotseat</span>
          </a>
        </li>`,
      ).join("");
    </script>
  </body>
</html>
