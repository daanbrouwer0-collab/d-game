<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="mem-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mem-card-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="mem-card-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="mem-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#mem-bg)"/>
  
  <!-- Subtle decorative background circles -->
  <circle cx="180" cy="120" r="160" fill="#6366f1" opacity="0.08"/>
  <circle cx="640" cy="360" r="180" fill="#ec4899" opacity="0.08"/>

  <!-- Memory Cards layout -->
  <g transform="translate(200, 80)" filter="url(#mem-glow)">
    <!-- Card 1 (Front - Star) -->
    <rect x="0" y="0" width="110" height="150" rx="14" fill="#1e293b" stroke="url(#mem-card-1)" stroke-width="3"/>
    <text x="55" y="90" font-size="48" text-anchor="middle" fill="#fbbf24">⭐</text>
    
    <!-- Card 2 (Front - Star match) -->
    <rect x="145" y="0" width="110" height="150" rx="14" fill="#1e293b" stroke="url(#mem-card-1)" stroke-width="3"/>
    <text x="200" y="90" font-size="48" text-anchor="middle" fill="#fbbf24">⭐</text>
    
    <!-- Card 3 (Back) -->
    <rect x="290" y="0" width="110" height="150" rx="14" fill="url(#mem-card-2)" stroke="#f43f5e" stroke-width="2"/>
    <text x="345" y="90" font-size="40" text-anchor="middle" fill="#ffffff" font-weight="900">?</text>

    <!-- Card 4 (Back) -->
    <rect x="0" y="170" width="110" height="150" rx="14" fill="url(#mem-card-2)" stroke="#f43f5e" stroke-width="2"/>
    <text x="55" y="260" font-size="40" text-anchor="middle" fill="#ffffff" font-weight="900">?</text>

    <!-- Card 5 (Front - Gem) -->
    <rect x="145" y="170" width="110" height="150" rx="14" fill="#1e293b" stroke="url(#mem-card-1)" stroke-width="3"/>
    <text x="200" y="260" font-size="48" text-anchor="middle" fill="#38bdf8">💎</text>

    <!-- Card 6 (Back) -->
    <rect x="290" y="170" width="110" height="150" rx="14" fill="url(#mem-card-2)" stroke="#f43f5e" stroke-width="2"/>
    <text x="345" y="260" font-size="40" text-anchor="middle" fill="#ffffff" font-weight="900">?</text>
  </g>

  <!-- Title & Tagline -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <text x="400" y="440" font-size="32" font-weight="800" fill="#f8fafc" letter-spacing="1">GEHEUGEN</text>
    <text x="400" y="470" font-size="15" font-weight="500" fill="#94a3b8">Train je geheugen · Vind alle paren</text>
  </g>
</svg>
