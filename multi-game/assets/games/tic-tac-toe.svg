<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#141c30"/>
      <stop offset="100%" stop-color="#091322"/>
    </linearGradient>
    <linearGradient id="grid-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="x-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="o-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Subtle decorative background circles -->
  <circle cx="150" cy="120" r="180" fill="#3b82f6" opacity="0.07"/>
  <circle cx="680" cy="380" r="200" fill="#8b5cf6" opacity="0.08"/>

  <!-- 4x4 Grid in center -->
  <g transform="translate(250, 70)" stroke="url(#grid-grad)" stroke-width="6" stroke-linecap="round" opacity="0.85" filter="url(#glow)">
    <!-- Vertical lines -->
    <line x1="75" y1="0" x2="75" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="225" y1="0" x2="225" y2="300"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="75" x2="300" y2="75"/>
    <line x1="0" y1="150" x2="300" y2="150"/>
    <line x1="0" y1="225" x2="300" y2="225"/>
  </g>

  <!-- Symbols inside grid -->
  <!-- X at row 0, col 1 -->
  <g transform="translate(325, 70)" stroke="url(#x-grad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)">
    <line x1="20" y1="20" x2="55" y2="55"/>
    <line x1="55" y1="20" x2="20" y2="55"/>
  </g>
  <!-- O at row 1, col 2 -->
  <circle cx="437" cy="182" r="20" fill="none" stroke="url(#o-grad)" stroke-width="8" filter="url(#glow)"/>
  <!-- X at row 2, col 2 -->
  <g transform="translate(400, 220)" stroke="url(#x-grad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)">
    <line x1="20" y1="20" x2="55" y2="55"/>
    <line x1="55" y1="20" x2="20" y2="55"/>
  </g>
  <!-- O at row 0, col 3 -->
  <circle cx="512" cy="107" r="20" fill="none" stroke="url(#o-grad)" stroke-width="8" filter="url(#glow)"/>
  <!-- Blocked cell indicator at row 2, col 0 -->
  <rect x="260" y="230" width="55" height="55" rx="8" fill="#334155" opacity="0.6"/>
  <line x1="270" y1="240" x2="305" y2="275" stroke="#64748b" stroke-width="3"/>
  <line x1="305" y1="240" x2="270" y2="275" stroke="#64748b" stroke-width="3"/>

  <!-- Title & Tagline -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <text x="400" y="420" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="1">TIC TAC TOE</text>
    <text x="400" y="455" font-size="16" font-weight="500" fill="#94a3b8">4×4 Boter-kaas-en-eieren · 2 Spelers</text>
  </g>
</svg>
