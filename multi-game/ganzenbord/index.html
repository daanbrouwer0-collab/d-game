<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ganzenbord — D-Game</title>
    <meta
      name="description"
      content="Klassiek ganzenbord (63 vakjes) hotseat op dit apparaat, of multiplayer via een D-Game room."
    />
    <link rel="stylesheet" href="../css/site.css" />
  </head>
  <body>
    <div class="app app-wide">
      <header class="header">
        <p class="nav"><a href="../">← D-Game</a></p>
        <h1 class="brand">Ganzenbord</h1>
        <p id="connection-status" class="status" data-state="idle">Niet verbonden</p>
      </header>

      <main>
        <p id="lobby-error" class="error" role="alert"></p>
        <p id="lobby-hint" class="hint"></p>

        <section id="setup" class="panel">
          <h2>Op dit apparaat</h2>
          <p class="lede">
            Tot 6 spelers hotseat op één toestel. Multiplayer met vrienden: start een room op de
            home-pagina.
          </p>

          <label class="field-label" for="player-name">Jouw naam</label>
          <input
            id="player-name"
            class="field"
            type="text"
            maxlength="20"
            placeholder="bijv. Sam"
            autocomplete="nickname"
          />

          <div class="actions">
            <button type="button" id="btn-local" class="btn btn-primary">
              Speel hier
            </button>
            <a href="../room/" class="btn btn-ghost">Naar room (multiplayer)</a>
          </div>
        </section>

        <section id="lobby" class="panel hidden">
          <div class="lobby-header">
            <h2>Lobby</h2>
            <p id="lobby-count" class="lobby-count">0 / 6 spelers</p>
          </div>

          <p class="lede">Voeg spelers toe op dit apparaat, start daarna het spel.</p>

          <ul id="player-list" class="player-list"></ul>

          <div id="host-controls" class="host-controls">
            <div id="local-add" class="local-add">
              <label class="field-label" for="local-player-name">Extra speler (dit apparaat)</label>
              <div class="join-controls">
                <input
                  id="local-player-name"
                  class="field"
                  type="text"
                  maxlength="20"
                  placeholder="Naam"
                  autocomplete="off"
                />
                <button type="button" id="btn-add-local" class="btn btn-ghost">Toevoegen</button>
              </div>
            </div>
            <button type="button" id="btn-start" class="btn btn-primary" disabled>
              Start (min. 2 spelers)
            </button>
          </div>

          <div class="actions">
            <button type="button" id="btn-leave" class="btn btn-ghost">Verlaat lobby</button>
          </div>
        </section>

        <section id="game" class="panel panel-game hidden">
          <div class="game-hud">
            <p id="you-label" class="meta you-label-goose"></p>
            <p id="turn-label" class="meta turn-banner"></p>
            <div id="turn-timer" class="turn-timer hidden" aria-live="polite">
              <div class="turn-timer-track">
                <div id="turn-timer-fill" class="turn-timer-fill"></div>
              </div>
              <span id="turn-timer-label" class="turn-timer-label">20s</span>
            </div>
            <div id="win-banner" class="win-banner hidden" role="status" aria-live="polite">
              <p class="win-banner-kicker">Winnaar</p>
              <div id="win-banner-body" class="win-banner-body"></div>
            </div>
            <p id="log-label" class="log"></p>
          </div>

          <div id="positions" class="positions"></div>
          <div id="board-track" class="goose-board" role="img" aria-label="Ganzenbord zigzag-grid"></div>
          <div id="goose-legend" class="goose-legend" aria-label="Legenda speciale vakjes"></div>

          <div class="actions">
            <button type="button" id="btn-roll" class="btn btn-primary btn-roll" disabled>
              Gooi dobbelsteen
            </button>
            <button type="button" id="btn-leave-game" class="btn btn-ghost">Verlaten</button>
          </div>

          <div id="win-actions" class="actions win-actions hidden">
            <button type="button" id="btn-rematch" class="btn btn-primary" disabled>
              Opnieuw spelen
            </button>
            <button type="button" id="btn-to-lobby" class="btn btn-ghost" disabled>
              Terug naar lobby
            </button>
          </div>
        </section>
      </main>
    </div>

    <script type="module">
      import { getUrlParams } from "../js/shell/site-url.js";
      import { redirectLegacyGameRoomToShell } from "../js/shell/room-only-multiplayer.js";
      if (getUrlParams().get("embedded") === "1") {
        import("./embedded.js");
      } else if (!redirectLegacyGameRoomToShell()) {
        import("./main.js");
      }
    </script>
  </body>
</html>
